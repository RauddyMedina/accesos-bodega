<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a12">
<title>Accesos Bodega</title>
<style>
  :root{
    --bg:#0a0a12; --surface:#12121f; --surface2:#171728; --border:#242640;
    --text:#e6ebff; --text2:#9aa3c7; --accent:#00fff7; --accent2:#ff2bd6;
    --btn-text:#04121a;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef1f8; --surface:#ffffff; --surface2:#f4f6fc; --border:#d6dcec;
      --text:#131627; --text2:#5a6488; --accent:#0b8f88; --accent2:#c01f9c;
      --btn-text:#ffffff;
    }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  body{min-height:100vh; padding:20px 16px 40px;}
  .wrap{max-width:760px; margin:0 auto;}
  header{text-align:center; padding:16px 0 8px;}
  .logo{font-size:40px; line-height:1;}
  h1{font-size:24px; font-weight:800; letter-spacing:.5px; margin-top:8px; color:var(--accent);}
  .sub{color:var(--text2); font-size:14px; margin-top:6px;}
  .grid{display:flex; flex-direction:column; gap:14px; margin-top:24px;}
  .card{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:14px; padding:18px 18px 20px; display:flex; flex-direction:column; gap:10px;}
  .card-top{display:flex; align-items:center; gap:12px;}
  .card-emoji{font-size:30px; line-height:1; flex-shrink:0;}
  .card-name{font-size:19px; font-weight:700; color:var(--text);}
  .card-desc{color:var(--text2); font-size:14.5px; line-height:1.5;}
  .card a.btn{margin-top:4px; display:block; text-align:center; text-decoration:none;
    background:var(--accent); color:var(--btn-text); font-weight:800; font-size:16px;
    padding:14px; border-radius:10px; transition:filter .15s, transform .05s;}
  .card a.btn:hover{filter:brightness(1.08);}
  .card a.btn:active{transform:scale(.985);}
  .card .url{font-size:11.5px; color:var(--text2); word-break:break-all; text-align:center;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  footer{text-align:center; color:var(--text2); font-size:12px; margin-top:32px; line-height:1.6;}
  footer b{color:var(--text);}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">📦</div>
      <h1>ACCESOS BODEGA</h1>
      <div class="sub">Todas las apps del trabajo en un solo lugar. Tocá "Abrir" en la que necesites.</div>
    </header>

    <main class="grid" id="grid"></main>

    <footer>
      Guardá este link o el ícono en tu pantalla de inicio.<br>
      ¿Falta una app o un link cambió? Avisá a <b>Rauddy</b>.
    </footer>
  </div>

<script>
  // Editar acá para agregar/quitar apps. Se renderiza abajo como tarjetas.
  const APPS = [
    { emoji:"📦", nombre:"Generador de TIM Reingresos",
      url:"https://tim-reingresos-fluxaia.streamlit.app/",
      desc:"Genera la hoja TIM de reingresos (Easy/Paris) pegando los N° de entrega/ID. Autocompleta SKU, descripción y unidades, y tiene el botón para enviar al Tablero de Reingresos." },
    { emoji:"📸", nombre:"Tablero de Reingresos",
      url:"https://rauddymedina.github.io/reingresos-tim/",
      desc:"El bodeguero rebaja los reingresos (por cliente + fecha del TIM) dejando foto de cada producto y del palet armado." },
    { emoji:"✅", nombre:"Rendiciones Transportistas",
      url:"https://rauddymedina.github.io/rendiciones-opl/",
      desc:"Los bodegueros rinden / rebajan las entregas del día con respaldo fotográfico por patente." },
    { emoji:"🖍️", nombre:"Hoja de Ruta - Rendiciones",
      url:"https://rauddymedina.github.io/HojaRutaRendiciones/",
      desc:"Marca las rendiciones directamente sobre las hojas de ruta de los drivers, a partir de lo descargado de Hela." },
    { emoji:"🔳", nombre:"Picking QR",
      url:"https://rauddymedina.github.io/picking-qr/",
      desc:"El pickeador escanea el QR del fleje de Beetrack y ve al instante la LETRA de destino y la lista de productos." },
    { emoji:"🔫", nombre:"Escáner de Bodega (programa PC)",
      url:"https://drive.google.com/file/d/1_oAvW1fhx6K_3azefqCOUXP9h6TCs2AT/view",
      boton:"Descargar (Windows) ⬇",
      desc:"Programa para el computador de bodega (Windows). Se pistolea el cartón con la pistola USB y muestra al instante la LETRA de destino y los productos del ID, registrando cada escaneo. No es una web: se descarga y se ejecuta en el PC." },
    { emoji:"🗺️", nombre:"Geolocalizador PRO",
      url:"https://geolocator.fluxaia.cloud",
      desc:"Planificador rápido de rutas sobre el mapa: arma y asigna cargas por patente." },
    { emoji:"📋", nombre:"Inventario de Bodega",
      url:"https://inventario.fluxaia.cloud",
      desc:"Lo que debería estar físicamente en bodega para hacer el conteo, ya descontado lo que salió a ruta. Primero se sube el archivo de Beetrack con lo que está en ruta, después Actualizar y se baja el Excel. La columna PISTOLEADO dice si alguien ya sacó el bulto del rack. Pide usuario y clave." },
    { emoji:"⚠️", nombre:"Declaración de Daños",
      url:"https://declaracion-danos.onrender.com",
      desc:"Los operarios de andén declaran los daños de embalaje de la carga, con foto, antes de despachar. (Puede tardar unos segundos en despertar.)" },
    { emoji:"💸", nombre:"Control de Cobros",
      url:"https://cobros.fluxaia.cloud",
      desc:"Las actas de cobro de Easy y de París en un solo lugar. Se sube el Excel del acta y el sistema reconoce solo de qué cliente es. Muestra cuánto se está cobrando a la operación y cuánto a cada patente, y permite anotar contra qué orden de compra va cada cobro. También se cargan los Resúmenes Descarga de Easy, para avisar si cobraron algo que no estaba autorizado. Tiene dos claves: una para subir y otra para revisar." },
    { emoji:"🔢", nombre:"Conteo de Bodega",
      url:"https://inventario.fluxaia.cloud/conteo",
      desc:"Para hacer el inventario pistoleando, sin imprimir nada. Se abre el conteo del día y se va escaneando el cartón de cada bulto del rack: la app dice al instante si estaba en la lista, si sobra o si ya se contó. Sirve el lector Bluetooth y también la cámara del celular, y si el código no se deja leer se le saca una foto. Pueden contar varios a la vez y todos ven el mismo avance. Pide clave." },
    { emoji:"🚦", nombre:"Rendiciones en vivo",
      url:"https://inventario.fluxaia.cloud/rendiciones",
      desc:"Semáforo por patente de qué falta rendir con foto, al momento. No hay que esperar a que alguien suba el archivo de Beetrack: apenas el bodeguero rinde, acá se ve. Tiene aparte la pestaña de lo que va a reingreso. Pide clave." },
    { emoji:"📈", nombre:"Nivel de Servicio (KPI Bodega)",
      url:"https://kpibodega1.fluxaia.cloud",
      desc:"El tablero del nivel de servicio: puntualidad y cumplimiento del día y del mes, por cliente, por comuna y por patente, con lo que todavía está en bodega sin salir. También muestra cuánto libera cada local de OPL (Viña y Belloto). Pide clave." },
    { emoji:"🚚", nombre:"Rutas de la Casa",
      url:"https://rutas.fluxaia.cloud",
      desc:"Qué sacó cada camión propio día a día y cuánto genera. El sistema propone si fue media ruta, una o doble según los pedidos que llevó, y cuál fue la comuna más lejana; la persona de control valida con un check y el total del mes por patente sale solo. Pide clave." },
    { emoji:"📤", nombre:"Cargar rutas en hela",
      url:"https://inventario.fluxaia.cloud/hela",
      desc:"Crea en hela las rutas del día a partir de lo planificado, en vez de pegarlas una por una. Antes de crear avisa qué pedidos hela todavía no conoce (si no, los descarta sin decir nada) y deja vaciar o mover rutas. Pide clave." },
    { emoji:"🗃️", nombre:"Bases de datos (Easy y Paris)",
      url:"https://inventario.fluxaia.cloud/bases",
      desc:"Desde acá se cargan las bases del CD: la de Easy se baja sola de los correos y la de Paris se sube a mano. Es lo que después alimenta el inventario, el escaneador y las alertas. Pide clave." },
  ];

  const grid = document.getElementById("grid");
  for (const app of APPS){
    const card = document.createElement("div");
    card.className = "card";
    // textContent para nombre/desc evita inyección; la URL va en href validado abajo.
    const top = document.createElement("div"); top.className = "card-top";
    const em = document.createElement("div"); em.className = "card-emoji"; em.textContent = app.emoji;
    const nm = document.createElement("div"); nm.className = "card-name"; nm.textContent = app.nombre;
    top.append(em, nm);
    const desc = document.createElement("div"); desc.className = "card-desc"; desc.textContent = app.desc;
    const a = document.createElement("a"); a.className = "btn"; a.textContent = app.boton || "Abrir →";
    a.href = app.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    const url = document.createElement("div"); url.className = "url"; url.textContent = app.url;
    card.append(top, desc, a, url);
    grid.appendChild(card);
  }
</script>
</body>
</html>
